<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16A34A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🌶️ ร้านส้มตำ</title>
<style>
:root{
  --g:#16A34A; --g2:#22C55E; --g3:#DCFCE7; --g4:#15803D;
  --r:#DC2626; --b:#2563EB; --o:#EA580C;
  --bg:#F0F7F1; --card:#fff; --t:#1F2937; --m:#6B7280; --bd:#E5E7EB;
  --shadow:0 1px 4px rgba(0,0,0,.05); --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Sarabun',sans-serif;
  background:var(--bg); color:var(--t);
  max-width:480px; margin:0 auto;
  padding:12px 12px 36px;
  font-size:15px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hd h1{font-size:20px;font-weight:800;color:var(--g)}
.hd .sub{font-size:11px;color:var(--m);margin-top:2px}
.refresh{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;
}
.refresh.spin{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;background:#fff;border-radius:12px;padding:3px;margin-bottom:10px;box-shadow:var(--shadow)}
.tab{flex:1;text-align:center;padding:8px 2px;font-size:12px;font-weight:700;color:var(--m);border-radius:10px;cursor:pointer;border:none;background:transparent}
.tab.on{background:var(--g);color:#fff}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hero{
  background:linear-gradient(145deg,#16A34A,#22C55E);
  color:#fff;border-radius:18px;padding:16px;margin-bottom:10px;
}
.hero .lbl{font-size:12px;opacity:.9}
.hero .val{font-size:28px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.hero .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.hero .mini{background:rgba(255,255,255,.15);border-radius:12px;padding:10px 6px;text-align:center}
.hero .mini .l{font-size:10px;opacity:.9}
.hero .mini .n{font-size:14px;font-weight:700;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{text-align:center}
.kpi .l{font-size:11px;color:var(--m)}
.kpi .n{font-size:17px;font-weight:800;margin-top:3px}
.sec{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sec .hint{font-size:11px;font-weight:500;color:var(--m)}
.pos{color:var(--g);font-weight:700}
.neg{color:var(--r);font-weight:700}
.mut{color:var(--m)}
.cmp div{font-size:13px;margin-bottom:5px}
.hbar{margin-bottom:12px}
.hbar:last-child{margin-bottom:0}
.hbar .head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px}
.hbar .rows{display:flex;flex-direction:column;gap:5px}
.hbar .r{display:flex;align-items:center;gap:6px}
.hbar .nm{width:28px;font-size:10px;font-weight:700;color:var(--m);text-align:right;flex-shrink:0}
.hbar .track{flex:1;height:14px;background:#E5E7EB;border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;min-width:2px}
.hbar .fill.s{background:linear-gradient(90deg,#60A5FA,#2563EB)}
.hbar .fill.e{background:linear-gradient(90deg,#FCA5A5,#DC2626)}
.hbar .fill.p{background:linear-gradient(90deg,#86EFAC,#16A34A)}
.hbar .fill.neg{background:linear-gradient(90deg,#FCA5A5,#DC2626)}
.hbar .v{font-size:10px;font-weight:700;min-width:48px;text-align:right;flex-shrink:0}
.hbar .v.s{color:var(--b)}
.hbar .v.e{color:var(--r)}
.hbar .v.p{color:var(--g)}
.hbar .v.neg{color:var(--r)}
.leg{display:flex;gap:12px;justify-content:center;margin-bottom:12px;font-size:11px;color:var(--m);font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.leg .s{background:var(--b)}
.leg .e{background:var(--r)}
.leg .p{background:var(--g)}
.bar{height:10px;background:#E5E7EB;border-radius:99px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--g2);border-radius:99px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F3F4F6}
.item:last-child{border-bottom:none}
.item .t{font-size:13px;font-weight:600}
.item .c{font-size:11px;color:var(--m);margin-top:2px}
.item .a{font-size:13px;font-weight:700;color:var(--g);white-space:nowrap;margin-left:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 12px;background:var(--g3);color:#15803D;
  border-radius:99px;font-size:12px;font-weight:600;border:none;cursor:pointer;
}
.chip.on{background:var(--g);color:#fff}
.inp{
  width:100%;padding:11px 12px;border:none;outline:none;
  background:#F3F4F6;border-radius:12px;font-size:14px;font-family:inherit;
}
.load{text-align:center;padding:48px 16px;color:var(--m);font-size:14px}
.err{text-align:center;padding:28px 16px;color:var(--m);font-size:13px;line-height:1.6}
.err .ic{font-size:32px;margin-bottom:8px}
.btn{display:inline-block;margin-top:12px;background:var(--g);color:#fff;border:none;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}
.upd{font-size:11px;color:var(--m);text-align:center;margin-top:8px}
.mrow{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:4px;align-items:center;padding:8px 0;border-bottom:1px solid #F3F4F6;font-size:12px}
.mrow:last-child{border-bottom:none}
.mrow.h{color:var(--m);font-weight:600;font-size:11px;padding-bottom:4px}
</style>
</head>
<body>
<div class="hd">
  <div>
    <h1>🌶️ ร้านส้มตำ</h1>
    <div class="sub" id="status">กำลังโหลด...</div>
  </div>
  <button class="refresh" id="refreshBtn" type="button">🔄</button>
</div>

<div id="load" class="card load">กำลังโหลดข้อมูล...</div>
<div id="err" class="card err" style="display:none"></div>
<div id="app" style="display:none">

  <div class="tabs" id="rangeTabs">
    <button class="tab on" data-r="today" type="button">วันนี้</button>
    <button class="tab" data-r="week" type="button">สัปดาห์</button>
    <button class="tab" data-r="month" type="button">เดือนนี้</button>
  </div>

  <div class="hero">
    <div class="lbl" id="heroLbl">ช่วงนี้</div>
    <div class="val" id="heroProfit">฿0</div>
    <div class="grid">
      <div class="mini"><div class="l">ยอดขาย</div><div class="n" id="heroSales">฿0</div></div>
      <div class="mini"><div class="l">รายจ่าย</div><div class="n" id="heroExp">฿0</div></div>
      <div class="mini"><div class="l">% ต้นทุน</div><div class="n" id="heroRatio">—</div></div>
    </div>
  </div>

  <div class="row3">
    <div class="card kpi"><div class="l">ขายเดือนนี้</div><div class="n" id="mS" style="color:var(--b)">฿0</div></div>
    <div class="card kpi"><div class="l">จ่ายเดือนนี้</div><div class="n" id="mE" style="color:var(--r)">฿0</div></div>
    <div class="card kpi"><div class="l">กำไรเดือนนี้</div><div class="n" id="mP">฿0</div></div>
  </div>

  <div class="card">
    <div class="sec">เทียบเดือนก่อน</div>
    <div class="cmp" id="cmp"></div>
  </div>

  <div class="card">
    <div class="sec">📈 กราฟรายวัน <span class="hint">แท่งแนวนอน</span></div>
    <div class="leg"><span><i class="s"></i>ขาย</span><span><i class="e"></i>จ่าย</span><span><i class="p"></i>กำไร</span></div>
    <div id="dayChart"></div>
  </div>

  <div class="card">
    <div class="sec">📊 รายเดือน</div>
    <div class="mrow h">
      <div>เดือน</div>
      <div style="text-align:right">ขาย</div>
      <div style="text-align:right">จ่าย</div>
      <div style="text-align:right">กำไร</div>
    </div>
    <div id="tbl"></div>
  </div>

  <div id="top"></div>
  <div id="ins"></div>

  <div class="card">
    <div class="sec">🔍 รายจ่าย</div>
    <div class="chips" id="pChips">
      <button class="chip on" data-p="all" type="button">ทั้งหมด</button>
      <button class="chip" data-p="today" type="button">วันนี้</button>
      <button class="chip" data-p="7d" type="button">7 วัน</button>
      <button class="chip" data-p="month" type="button">เดือนนี้</button>
    </div>
    <div class="chips" id="cChips">
      <button class="chip on" data-c="all" type="button">ทุกหมวด</button>
      <button class="chip" data-c="วัตถุดิบ" type="button">วัตถุดิบ</button>
      <button class="chip" data-c="เครื่องดื่ม" type="button">เครื่องดื่ม</button>
      <button class="chip" data-c="บรรจุภัณฑ์" type="button">บรรจุภัณฑ์</button>
      <button class="chip" data-c="ค่าใช้จ่ายร้าน" type="button">ค่าใช้จ่ายร้าน</button>
      <button class="chip" data-c="อื่นๆ" type="button">อื่นๆ</button>
    </div>
    <input class="inp" id="q" placeholder="ค้นหารายการ / ร้าน..." inputmode="search">
  </div>
  <div id="list"></div>
  <div class="upd" id="upd"></div>
</div>

<script>
const ID='10D-GwPgOJ98JU-rTyzonTYsM8Gg6mTzluqy6Q5nJoCA';
const CK='st_dash_v2', TTL=5*60*1000;
const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const WD=['อา','จ','อ','พ','พฤ','ศ','ส'];
let EXP=[], SAL=[], range='today', pF='all', cF='all', kw='';

const $=id=>document.getElementById(id);
const money=n=>{
  n=+n||0;
  return (n<0?'-':'')+'฿'+Math.abs(Math.round(n)).toLocaleString('th-TH');
};
const amt=v=>v==null||v===''?0:parseFloat(String(v).replace(/,/g,''))||0;

function pDate(v){
  if(!v) return null;
  const s=String(v);
  let m=s.match(/^Date\((\d+),(\d+),(\d+)/);
  if(m) return new Date(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(v); return isNaN(d)?null:d;
}
const same=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

async function fetchSheet(name){
  const u=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const res=await fetch(u);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const t=await res.text();
  const j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
  if(!j.table||!j.table.cols) throw new Error('ไม่พบชีต '+name);
  const cols=j.table.cols.map(c=>c.label||'');
  return (j.table.rows||[]).map(r=>{
    const o={};
    (r.c||[]).forEach((c,i)=>{ if(cols[i]) o[cols[i]]=c?(c.v??c.f):null; });
    return o;
  });
}

function prepExp(rows){
  return rows.map(r=>({
    d:pDate(r['วันที่']),
    a:amt(r['ยอดเงิน']),
    c:String(r['หมวดหมู่']||'อื่นๆ').trim()||'อื่นๆ',
    t:String(r['รายละเอียด']||'').trim(),
    s:String(r['ร้านค้า/ผู้รับเงิน']||'').trim(),
    sub:String(r['หมวดย่อย']||'').trim()
  })).filter(x=>x.a>0&&x.d);
}
function prepSal(rows){
  return rows.map(r=>({d:pDate(r['วันที่']),a:amt(r['ยอดขาย'])})).filter(x=>x.a>0&&x.d);
}
const sum=(arr,fn)=>arr.reduce((s,x)=>fn(x)?s+x.a:s,0);

function getRange(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(range==='today') return {from:today, to:now, label:'วันนี้'};
  if(range==='week'){
    const from=new Date(today);
    from.setDate(from.getDate()-today.getDay());
    return {from, to:now, label:'สัปดาห์นี้'};
  }
  return {from:new Date(now.getFullYear(),now.getMonth(),1), to:now, label:'เดือนนี้'};
}

function renderHero(){
  const {from,to,label}=getRange();
  const sales=sum(SAL,x=>x.d>=from&&x.d<=to);
  const exp=sum(EXP,x=>x.d>=from&&x.d<=to);
  const profit=sales-exp;
  const ratio=sales>0?(exp/sales*100):null;

  $('heroLbl').textContent='กำไรสุทธิ · '+label;
  $('heroProfit').textContent=money(profit);
  $('heroProfit').style.color='#fff';
  $('heroSales').textContent=money(sales);
  $('heroExp').textContent=money(exp);
  $('heroRatio').textContent=ratio!==null?ratio.toFixed(1)+'%':'—';
}

function renderDayChart(){
  const {from,to}=getRange();
  const days=[];
  let maxV=1;
  const cur=new Date(from);
  cur.setHours(0,0,0,0);
  const end=new Date(to);
  end.setHours(23,59,59,999);
  while(cur<=end){
    const d=new Date(cur);
    const sales=sum(SAL,x=>same(x.d,d));
    const exp=sum(EXP,x=>same(x.d,d));
    const profit=sales-exp;
    days.push({d,sales,exp,profit});
    maxV=Math.max(maxV,sales,exp,Math.abs(profit));
    cur.setDate(cur.getDate()+1);
  }
  const show=days.length>14?days.slice(-14):days;
  if(!show.length){
    $('dayChart').innerHTML='<div class="mut" style="text-align:center;padding:12px">ไม่มีข้อมูล</div>';
    return;
  }
  const today=new Date();
  $('dayChart').innerHTML=show.map(x=>{
    const sW=Math.max(2,Math.round(x.sales/maxV*100));
    const eW=Math.max(2,Math.round(x.exp/maxV*100));
    const pW=Math.max(2,Math.round(Math.abs(x.profit)/maxV*100));
    const pCls=x.profit>=0?'p':'neg';
    const isT=same(x.d,today);
    return `<div class="hbar">
      <div class="head"><span>${x.d.getDate()} ${TH[x.d.getMonth()]} · ${WD[x.d.getDay()]}</span>${isT?'<span class="mut">วันนี้</span>':''}</div>
      <div class="rows">
        <div class="r"><span class="nm">ขาย</span><div class="track"><div class="fill s" style="width:${sW}%"></div></div><span class="v s">${money(x.sales)}</span></div>
        <div class="r"><span class="nm">จ่าย</span><div class="track"><div class="fill e" style="width:${eW}%"></div></div><span class="v e">${money(x.exp)}</span></div>
        <div class="r"><span class="nm">กำไร</span><div class="track"><div class="fill ${pCls}" style="width:${pW}%"></div></div><span class="v ${pCls}">${money(x.profit)}</span></div>
      </div>
    </div>`;
  }).join('');
}

function render(){
  const now=new Date();
  const M=now.getMonth(), Y=now.getFullYear();
  const pM=M===0?11:M-1, pY=M===0?Y-1:Y;

  renderHero();
  renderDayChart();

  const mS=sum(SAL,x=>x.d.getMonth()===M&&x.d.getFullYear()===Y);
  const mE=sum(EXP,x=>x.d.getMonth()===M&&x.d.getFullYear()===Y);
  const mP=mS-mE;
  $('mS').textContent=money(mS);
  $('mE').textContent=money(mE);
  const el=$('mP'); el.textContent=money(mP); el.style.color=mP>=0?'var(--g)':'var(--r)';

  const pS=sum(SAL,x=>x.d.getMonth()===pM&&x.d.getFullYear()===pY);
  const pE=sum(EXP,x=>x.d.getMonth()===pM&&x.d.getFullYear()===pY);
  const pP=pS-pE;
  const dS=mS-pS, dE=mE-pE, dP=mP-pP;
  $('cmp').innerHTML=`
    <div>ขาย <span class="${dS>=0?'pos':'neg'}">${dS>=0?'▲':'▼'} ${money(Math.abs(dS))}</span> <span class="mut">(ก่อน ${money(pS)})</span></div>
    <div>จ่าย <span class="${dE<=0?'pos':'neg'}">${dE<=0?'▼':'▲'} ${money(Math.abs(dE))}</span> <span class="mut">(ก่อน ${money(pE)})</span></div>
    <div>กำไร <span class="${dP>=0?'pos':'neg'}">${dP>=0?'▲':'▼'} ${money(Math.abs(dP))}</span> <span class="mut">(ก่อน ${money(pP)})</span></div>`;

  const keys=new Set();
  SAL.forEach(x=>keys.add(mk(x.d)));
  EXP.forEach(x=>keys.add(mk(x.d)));
  const months=[...keys].sort().reverse();
  const sMap={}, eMap={};
  SAL.forEach(x=>{const k=mk(x.d);sMap[k]=(sMap[k]||0)+x.a});
  EXP.forEach(x=>{const k=mk(x.d);eMap[k]=(eMap[k]||0)+x.a});
  $('tbl').innerHTML=months.map(k=>{
    const [y,m]=k.split('-');
    const s=sMap[k]||0, e=eMap[k]||0, p=s-e;
    return `<div class="mrow"><div>${TH[+m-1]} ${String(y).slice(2)}</div>
      <div style="text-align:right;color:var(--b)">${money(s)}</div>
      <div style="text-align:right;color:var(--r)">${money(e)}</div>
      <div style="text-align:right" class="${p>=0?'pos':'neg'}">${money(p)}</div></div>`;
  }).join('')||'<div class="mut">ยังไม่มีข้อมูล</div>';

  const cat={};
  EXP.filter(x=>x.d.getMonth()===M&&x.d.getFullYear()===Y).forEach(x=>{cat[x.c]=(cat[x.c]||0)+x.a});
  const arr=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxC=arr[0]?arr[0][1]:1;
  $('top').innerHTML=`<div class="card"><div class="sec">🔥 Top รายจ่ายเดือนนี้</div>${
    arr.length?arr.map(([n,v])=>`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px">
        <span>${n}</span><span>${money(v)} <span class="mut">${Math.round(v/Math.max(mE,1)*100)}%</span></span>
      </div>
      <div class="bar"><i style="width:${Math.round(v/maxC*100)}%"></i></div>
    </div>`).join(''):'<div class="mut">ยังไม่มีข้อมูล</div>'
  }</div>`;

  let insight='รอข้อมูลเพิ่มเติม';
  if(mP<0) insight=`เดือนนี้ขาดทุน ${money(Math.abs(mP))} — ตรวจวัตถุดิบและค่าใช้จ่ายร้าน`;
  else if(pP>0&&mP<pP*0.7) insight=`กำไรลดลงแรงจากเดือนก่อน — ดูต้นทุนหรือยอดขายชะลอ`;
  else if(mS&&mE/mS>0.75) insight=`รายจ่าย ${Math.round(mE/mS*100)}% ของยอดขาย — คุมวัตถุดิบและค่าใช้จ่ายร้าน`;
  else if(mP>0) insight=`กำไร ${money(mP)} (มาร์จิ้น ~${mS?Math.round(mP/mS*100):0}%) — รักษาระดับนี้`;
  $('ins').innerHTML=`<div class="card"><div class="sec">⚠️ ควรรู้ตอนนี้</div><div style="font-size:13px;color:#166534;line-height:1.55">${insight}</div></div>`;

  list();
}

function list(){
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let L=[...EXP];
  if(pF==='today') L=L.filter(x=>same(x.d,today));
  else if(pF==='7d'){const f=new Date(today);f.setDate(f.getDate()-6);L=L.filter(x=>x.d>=f)}
  else if(pF==='month') L=L.filter(x=>x.d.getMonth()===now.getMonth()&&x.d.getFullYear()===now.getFullYear());
  if(cF!=='all') L=L.filter(x=>x.c===cF);
  if(kw){const k=kw.toLowerCase();L=L.filter(x=>(x.t+x.s+x.sub).toLowerCase().includes(k))}
  L.sort((a,b)=>b.d-a.d||b.a-a.a);
  const tot=L.reduce((s,x)=>s+x.a,0);
  const show=L.slice(0,40);
  const title=kw?'ผลการค้นหา':pF==='today'?'วันนี้':pF==='7d'?'7 วัน':pF==='month'?'เดือนนี้':'ล่าสุด';
  $('list').innerHTML=`<div class="card"><div class="sec">${title} <span class="mut" style="font-weight:500;font-size:12px">· ${L.length} ราย · ${money(tot)}</span></div>${
    show.length?show.map(x=>`<div class="item">
      <div><div class="t">${x.t||x.s||'—'}</div>
      <div class="c">${x.c}${x.sub?' · '+x.sub:''} · ${x.d.getDate()}/${x.d.getMonth()+1}</div></div>
      <div class="a">${money(x.a)}</div></div>`).join(''):'<div class="mut">ไม่พบรายการ</div>'
  }</div>`;
}

async function load(){
  $('refreshBtn').classList.add('spin');
  try{
    // cache first
    try{
      const c=JSON.parse(localStorage.getItem(CK)||'null');
      if(c&&Date.now()-c.t<TTL&&c.e&&c.s){
        EXP=c.e.map(x=>({...x,d:new Date(x.d)}));
        SAL=c.s.map(x=>({...x,d:new Date(x.d)}));
        $('load').style.display='none';
        $('err').style.display='none';
        $('app').style.display='block';
        $('status').textContent='จาก cache';
        render();
      }
    }catch(e){}

    const [er,sr]=await Promise.all([fetchSheet('รวม'),fetchSheet('ยอดขาย')]);
    EXP=prepExp(er);
    SAL=prepSal(sr);
    localStorage.setItem(CK,JSON.stringify({
      t:Date.now(),
      e:EXP.map(x=>({...x,d:x.d.toISOString()})),
      s:SAL.map(x=>({...x,d:x.d.toISOString()}))
    }));
    $('load').style.display='none';
    $('err').style.display='none';
    $('app').style.display='block';
    $('status').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    $('upd').textContent='อัปเดต '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){
    console.error(e);
    if(!$('app').style.display||$('app').style.display==='none'){
      $('load').style.display='none';
      $('err').style.display='block';
      $('err').innerHTML='<div class="ic">⚠️</div>โหลดไม่สำเร็จ<br>'+e.message+
        '<br><button class="btn" id="retryBtn" type="button">ลองอีกครั้ง</button>';
      $('retryBtn').onclick=load;
    }
    $('status').textContent='โหลดไม่สำเร็จ';
  }finally{
    $('refreshBtn').classList.remove('spin');
  }
}

$('rangeTabs').onclick=e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  [...$('rangeTabs').children].forEach(x=>x.classList.toggle('on',x===b));
  range=b.dataset.r;
  renderHero();
  renderDayChart();
};
$('pChips').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  [...$('pChips').children].forEach(x=>x.classList.toggle('on',x===b));
  pF=b.dataset.p; list();
};
$('cChips').onclick=e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  [...$('cChips').children].forEach(x=>x.classList.toggle('on',x===b));
  cF=b.dataset.c; list();
};
$('q').oninput=function(){kw=this.value.trim();list()};
$('refreshBtn').onclick=load;

load();
setInterval(load,5*60*1000);
</script>
